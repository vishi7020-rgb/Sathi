          cat > Saathi/app/src/main/java/com/saathi/app/Prefs.kt <<'SAATHI_EOF'
          package com.saathi.app

          import android.content.Context
          import android.content.SharedPreferences
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import org.json.JSONArray

          // API key aur yaaddasht phone mein encrypted rehti hain (Android Keystore).
          object Prefs {
              private var cached: SharedPreferences? = null

              private fun sp(c: Context): SharedPreferences {
                  cached?.let { return it }
                  val app = c.applicationContext
                  val s = EncryptedSharedPreferences.create(
                      app, "saathi_secure",
                      MasterKey.Builder(app).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(),
                      EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                      EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                  )
                  cached = s
                  return s
              }

              fun key(c: Context): String = sp(c).getString("k", "") ?: ""
              fun setKey(c: Context, v: String) = sp(c).edit().putString("k", v.trim()).apply()

              fun wakeEnabled(c: Context): Boolean = sp(c).getBoolean("wake", true)
              fun setWake(c: Context, v: Boolean) = sp(c).edit().putBoolean("wake", v).apply()
              fun wakeWord(c: Context): String = sp(c).getString("ww", "jarvis") ?: "jarvis"
              fun setWakeWord(c: Context, v: String) = sp(c).edit().putString("ww", v.trim().lowercase()).apply()

              fun memory(c: Context): List<String> = try {
                  val a = JSONArray(sp(c).getString("mem", "[]"))
                  List(a.length()) { a.getString(it) }
              } catch (e: Exception) {
                  emptyList()
              }

              private fun setMem(c: Context, l: List<String>) =
                  sp(c).edit().putString("mem", JSONArray(l).toString()).apply()

              fun addMemory(c: Context, s: String) {
                  if (s.isBlank()) return
                  setMem(c, (memory(c) + s.trim()).takeLast(60))
              }

              // keyword "*" = sab kuch bhula do. Kitni baatein hatayi, wo number lautata hai.
              fun forget(c: Context, kw: String): Int {
                  val k = kw.trim().lowercase()
                  val all = memory(c)
                  val keep = if (k == "*") emptyList<String>() else all.filter { !it.lowercase().contains(k) }
                  setMem(c, keep)
                  return all.size - keep.size
              }
          }
          SAATHI_EOF
          cat > Saathi/app/src/main/java/com/saathi/app/Gemini.kt <<'SAATHI_EOF'
          package com.saathi.app

          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class ApiError(val code: Int) : IOException("HTTP $code")

          data class Reply(val text: String, val tool: String? = null, val input: JSONObject? = null)

          object Gemini {
              // Pehla model na mile (404) to agla try hota hai.
              private val MODELS = listOf("gemini-2.5-flash-lite", "gemini-2.5-flash", "gemini-3.5-flash", "gemini-3.6-flash")
              private val RETRYABLE = setOf(404, 429, 500, 503)

              private const val SYSTEM =
                  "Tum Jarvis ho, ek voice personal assistant. Jawab Hinglish mein, Roman script mein do " +
                  "(sirf tab English, jab user English mein baat kare). Jawab bolke sunaya jayega, isliye " +
                  "1 se 2 chhote vakya, koi markdown, list ya emoji nahi. Phone ke kaam (alarm, timer, call, " +
                  "WhatsApp, app kholna, maps, YouTube) ke liye function call karo; tum khud kuch nahi karte, " +
                  "call, message, alarm aur timer se pehle app user se haan puchhegi. Jab user kahe yaad rakhna, " +
                  "remember function use karo. Taaza jaankari (khabar, score, mausam, price) ke liye web_search " +
                  "function use karo. Kisi baat ka pakka pata na ho to saaf bolo."

              private fun prop(type: String, desc: String) = JSONObject().put("type", type).put("description", desc)

              private fun props(vararg p: Pair<String, JSONObject>): JSONObject {
                  val o = JSONObject()
                  p.forEach { o.put(it.first, it.second) }
                  return o
              }

              private fun fn(name: String, desc: String, props: JSONObject, req: List<String>) = JSONObject()
                  .put("name", name)
                  .put("description", desc)
                  .put("parameters", JSONObject()
                      .put("type", "OBJECT")
                      .put("properties", props)
                      .put("required", JSONArray(req)))

              private fun tools(): JSONArray {
                  val text = { d: String -> prop("STRING", d) }
                  val decl = JSONArray()
                      .put(fn("set_alarm", "Alarm set karne ka prastav.",
                          props("hour" to prop("INTEGER", "0 se 23"), "minute" to prop("INTEGER", "0 se 59"),
                              "label" to text("Alarm ka naam")), listOf("hour", "minute")))
                      .put(fn("set_timer", "Countdown timer ka prastav.",
                          props("seconds" to prop("INTEGER", "Total seconds"), "label" to text("Timer ka naam")),
                          listOf("seconds")))
                      .put(fn("call_contact", "Kisi ko call karne ke liye dialer kholna.",
                          props("to" to text("Contact ka naam Roman script mein, jaise Mummy, ya phone number")),
                          listOf("to")))
                      .put(fn("whatsapp_message", "WhatsApp par message ka draft kholna. User khud send dabata hai.",
                                                props("to" to text("Contact ka naam Roman script mein, ya phone number"),
                              "text" to text("Message ka text")), listOf("to", "text")))
                      .put(fn("open_app", "Phone ki koi app kholna.",
                          props("app" to text("App ka naam English mein, jaise WhatsApp, YouTube, Camera, Settings")),
                          listOf("app")))
                      .put(fn("navigate_to", "Google Maps mein jagah dhoondhna ya rasta dikhana.",
                          props("place" to text("Jagah ka naam")), listOf("place")))
                      .put(fn("play_youtube", "YouTube par kuch dhoondhna ya chalana.",
                          props("query" to text("Kya dhoondhna hai")), listOf("query")))
                      .put(fn("remember", "User ne jo baat yaad rakhne ko kaha, use save karna.",
                          props("fact" to text("Chhota, saaf vakya, jaise: User ki gaadi ka number UP32 1234")),
                          listOf("fact")))
                      .put(fn("forget", "Yaad ki hui baatein bhulana. Sab bhulane ke liye keyword * dena.",
                          props("keyword" to text("Jis baat ko bhulana hai uska ek shabd")), listOf("keyword")))
                      .put(fn("web_search", "Taaza khabar, score, mausam, price ya internet ki jaankari chahiye ho tab.",
                          props("query" to text("Search query")), listOf("query")))
                  return JSONArray().put(JSONObject().put("functionDeclarations", decl))
              }

              private fun system(memory: List<String>): String {
                  val now = SimpleDateFormat("EEEE, d MMMM yyyy, hh:mm a", Locale("en", "IN")).format(Date())
                  val mem = if (memory.isEmpty()) "" else
                      "\nUser ke baare mein yaad rakhi baatein:\n" + memory.joinToString("\n") { "- $it" }
                  return SYSTEM + "\nAbhi ka samay: " + now + mem
              }

              private fun sysInstr(t: String) =
                  JSONObject().put("parts", JSONArray().put(JSONObject().put("text", t)))

              private fun gen(m: String): JSONObject {
                  val g = JSONObject().put("maxOutputTokens", if (m.startsWith("gemini-2.5")) 400 else 1024)
                  if (m.startsWith("gemini-2.5")) g.put("thinkingConfig", JSONObject().put("thinkingBudget", 0))
                  return g
              }

              private fun withModels(f: (String) -> JSONObject): JSONObject {
                  // Server busy (503/500) ho to ek baar dobara, phir agla model. 404/429 par seedha agla model.
                  var last: ApiError? = null
                  for (m in MODELS) {
                      var attempt = 0
                      while (attempt < 2) {
                          attempt++
                          try {
                              return f(m)
                          } catch (e: ApiError) {
                              if (e.code !in RETRYABLE) throw e
                              last = e
                              if ((e.code == 503 || e.code == 500) && attempt < 2) Thread.sleep(600) else break
                          } catch (e: java.net.SocketTimeoutException) {
                              last = ApiError(504)
                              break
                          }
                      }
                  }
                  throw last ?: ApiError(503)
              }

              private fun post(key: String, model: String, body: JSONObject): JSONObject {
                  val c = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
                      .openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 15000
                  c.readTimeout = 20000
                  c.doOutput = true
                  c.setRequestProperty("x-goog-api-key", key)
                  c.setRequestProperty("Content-Type", "application/json")
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = c.responseCode
                  if (code !in 200..299) throw ApiError(code)
                  return JSONObject(c.inputStream.bufferedReader().use { it.readText() })
              }

              private fun partsOf(res: JSONObject): JSONArray? = res.optJSONArray("candidates")
                  ?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")

              private fun textOf(parts: JSONArray?): String {
                  var t = ""
                  if (parts != null) {
                      for (i in 0 until parts.length()) {
                          val p = parts.getJSONObject(i)
                          if (!p.optBoolean("thought", false)) t += p.optString("text", "")
                      }
                  }
                  return t.trim()
              }

              fun ask(key: String, history: List<Pair<String, String>>, memory: List<String>): Reply {
                  val contents = JSONArray()
                  history.forEach { (r, c) ->
                      contents.put(JSONObject()
                          .put("role", if (r == "assistant") "model" else "user")
                          .put("parts", JSONArray().put(JSONObject().put("text", c))))
                  }
                  val res = withModels { m ->
                      post(key, m, JSONObject()
                          .put("systemInstruction", sysInstr(system(memory)))
                          .put("contents", contents)
                          .put("tools", tools())
                          .put("generationConfig", gen(m)))
                  }
                  val parts = partsOf(res)
                  var tool: String? = null
                  var input: JSONObject? = null
                  if (parts != null) {
                      for (i in 0 until parts.length()) {
                          val fc = parts.getJSONObject(i).optJSONObject("functionCall")
                          if (fc != null && tool == null) {
                              tool = fc.optString("name")
                              input = fc.optJSONObject("args") ?: JSONObject()
                          }
                      }
                  }
                  return Reply(textOf(parts), tool, input)
              }

              // Live jankari: Google Search ke saath alag request (function calling ke bina).
              fun search(key: String, query: String): String {
                  val sys = "Tum Jarvis ho. Google Search se taaza jaankari lekar Hinglish mein, Roman script mein, " +
                      "2 se 4 chhote vakya mein jawab do. Koi markdown, list ya emoji nahi."
                  val contents = JSONArray().put(JSONObject().put("role", "user")
                      .put("parts", JSONArray().put(JSONObject().put("text", query))))
                  val res = withModels { m ->
                      post(key, m, JSONObject()
                          .put("systemInstruction", sysInstr(sys))
                          .put("contents", contents)
                          .put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                          .put("generationConfig", gen(m)))
                  }
                  return textOf(partsOf(res))
              }
          }
          SAATHI_EOF
          cat > Saathi/app/src/main/java/com/saathi/app/MainActivity.kt <<'SAATHI_EOF'
          package com.saathi.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var info: TextView
              private lateinit var statusView: TextView

              private fun refreshStatus() {
                  statusView.text = "Wake status: " + (getSharedPreferences("st", MODE_PRIVATE).getString("wake", "abhi shuru nahi hua") ?: "")
              }

              override fun onResume() {
                  super.onResume()
                  refreshStatus()
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = (20 * resources.displayMetrics.density).toInt()
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(p, p * 2, p, p) }
                  col.addView(TextView(this).apply { text = "Jarvis"; textSize = 28f })
                  info = TextView(this).apply { text = "Neeche ke steps ek ek karke poore karo."; setPadding(0, p / 2, 0, p / 2) }
                  col.addView(info)
                  statusView = TextView(this).apply { textSize = 13f; setPadding(0, 0, 0, p / 2) }
                  col.addView(statusView)

                  val key = EditText(this).apply {
                      hint = "Gemini API key (aistudio.google.com se)"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(Prefs.key(this@MainActivity))
                  }
                  col.addView(key)
                  val wakeBox = CheckBox(this).apply {
                      text = "Jarvis bolkar jagao (experimental, battery zyada)"
                      isChecked = Prefs.wakeEnabled(this@MainActivity)
                  }
                  col.addView(wakeBox)
                  val wordBox = EditText(this).apply {
                      hint = "Jagane ka shabd (English, jaise jarvis ya computer)"
                      setText(Prefs.wakeWord(this@MainActivity))
                  }
                  col.addView(wordBox)
                  fun add(label: String, f: () -> Unit) =
                      col.addView(Button(this).apply { text = label; isAllCaps = false; setOnClickListener { f() } })

                  add("1. Settings save karo") {
                      Prefs.setKey(this, key.text.toString()); Prefs.setWake(this, wakeBox.isChecked)
                      Prefs.setWakeWord(this, wordBox.text.toString()); info.text = "Settings save ho gayi."
                  }
                  add("2. Overlay permission do") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  add("3. Mic, contacts aur notification permission do") {
                      val perms = mutableListOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS)
                      if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                      requestPermissions(perms.toTypedArray(), 1)
                  }
                  add("4. Jarvis bubble shuru karo") {
                      Prefs.setKey(this, key.text.toString()); Prefs.setWake(this, wakeBox.isChecked)
                      Prefs.setWakeWord(this, wordBox.text.toString())
                      when {
                          Prefs.key(this).isBlank() -> info.text = "Pehle API key daalo."
                          !Settings.canDrawOverlays(this) -> info.text = "Step 2: overlay permission do."
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED ->
                              info.text = "Step 3: mic permission do."
                          else -> {
                              startForegroundService(Intent(this, BubbleService::class.java))
                              moveTaskToBack(true)
                          }
                      }
                  }
                  add("Wake status dekho") { refreshStatus() }
                  add("Jarvis band karo") {
                      stopService(Intent(this, BubbleService::class.java)); info.text = "Jarvis band ho gaya."
                  }
                  setContentView(ScrollView(this).apply { addView(col) })
              }
          }
          SAATHI_EOF
          cat > Saathi/app/src/main/java/com/saathi/app/BubbleService.kt <<'SAATHI_EOF'
